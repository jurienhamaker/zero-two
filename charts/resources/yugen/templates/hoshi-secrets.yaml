apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: hoshi-secrets
  namespace: yugen
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
spec:
  refreshInterval: 24h0m0s
  secretStoreRef:
    name: op-secret-store
    kind: ClusterSecretStore
  target:
    name: hoshi-secrets
    template:
      metadata:
        labels:
          app.kubernetes.io/part-of: argocd
    creationPolicy: Owner
  data:
  - secretKey: WEBHOOK_AUTHORIZATION_TOKEN
    remoteRef:
      key: "yugen-secrets/shared/WEBHOOK_AUTHORIZATION_TOKEN"
      conversionStrategy: Default
      metadataPolicy: None
      decodingStrategy: None
  - secretKey: DISCORD_TOKEN
    remoteRef:
      key: "yugen-secrets/hoshi/DISCORD_TOKEN"
      conversionStrategy: Default
      metadataPolicy: None
      decodingStrategy: None
  - secretKey: TOP_GG_TOKEN
    remoteRef:
      key: "yugen-secrets/hoshi/TOP_GG_TOKEN"
      conversionStrategy: Default
      metadataPolicy: None
      decodingStrategy: None
  - secretKey: DISCORDBOTLIST_TOKEN
    remoteRef:
      key: "yugen-secrets/hoshi/DISCORDBOTLIST_TOKEN"
      conversionStrategy: Default
      metadataPolicy: None
      decodingStrategy: None
  - secretKey: SENTRY_DSN
    remoteRef:
      key: "yugen-secrets/hoshi/SENTRY_DSN"
      conversionStrategy: Default
      metadataPolicy: None
      decodingStrategy: None
